<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <!-- Sideline app icon, "Scoreboard": Ball.app style in the Wasabi and Nori palette.
       Editable source: real text in Barlow Condensed 800 (the app's condensed capitals).
       `npm run icons` (scripts/build-icons.mjs) outlines the text into icon-master-outlined.svg,
       derives icon-maskable.svg from the "board" group, and renders every size from them.
       Square and full-bleed with no rounded corners: iOS and Android apply their own masks.
       Colours are tokens from site/css/tokens.css: wasabi #A3C14A, nori #0F1F1C, paper #FFFFFF,
       rice #F5F2E8, board line #2A453F. -->
  <defs>
    <pattern id="stripes" width="17" height="17" patternUnits="userSpaceOnUse" patternTransform="rotate(25)">
      <rect width="2.4" height="17" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="#A3C14A"/>
  <rect width="200" height="200" fill="url(#stripes)"/>
  <g id="board">
    <rect x="14" y="38" width="172" height="124" rx="22" fill="#FFFFFF" stroke="#0F1F1C" stroke-width="6"/>
    <rect x="25" y="49" width="150" height="102" rx="13" fill="#0F1F1C"/>
    <line x1="100" y1="61" x2="100" y2="139" stroke="#2A453F" stroke-width="3"/>
    <text x="62" y="75" text-anchor="middle" font-family="Barlow Condensed" font-size="17" font-weight="800" letter-spacing="2" fill="#F5F2E8">HOME</text>
    <text x="138" y="75" text-anchor="middle" font-family="Barlow Condensed" font-size="17" font-weight="800" letter-spacing="2" fill="#F5F2E8">AWAY</text>
    <text x="62" y="137" text-anchor="middle" font-family="Barlow Condensed" font-size="64" font-weight="800" fill="#A3C14A">23</text>
    <text x="138" y="137" text-anchor="middle" font-family="Barlow Condensed" font-size="64" font-weight="800" fill="#A3C14A">9</text>
  </g>
</svg>
