<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <!-- Sideline app icon, "Sideline S": a bold S between chalk sidelines on wasabi.
       Editable source: real text in Space Grotesk Bold. `npm run icons` (scripts/build-icons.mjs)
       outlines the text into icon-master-outlined.svg, derives icon-maskable.svg from the "art"
       group, and renders every size from them. Square and full-bleed with no rounded corners:
       iOS and Android apply their own masks. Colours are tokens from site/css/tokens.css:
       wasabi #A3C14A, nori #0F1F1C, rice #F5F2E8 (the chalk). -->
  <rect width="200" height="200" fill="#A3C14A"/>
  <g id="art">
    <rect x="33.5" y="13" width="5" height="174" fill="#F5F2E8"/>
    <rect x="161.5" y="13" width="5" height="174" fill="#F5F2E8"/>
    <rect x="38.5" y="43.5" width="10" height="5" fill="#F5F2E8"/>
    <rect x="38.5" y="70.5" width="10" height="5" fill="#F5F2E8"/>
    <rect x="38.5" y="97.5" width="10" height="5" fill="#F5F2E8"/>
    <rect x="38.5" y="124.5" width="10" height="5" fill="#F5F2E8"/>
    <rect x="38.5" y="151.5" width="10" height="5" fill="#F5F2E8"/>
    <rect x="151.5" y="43.5" width="10" height="5" fill="#F5F2E8"/>
    <rect x="151.5" y="70.5" width="10" height="5" fill="#F5F2E8"/>
    <rect x="151.5" y="97.5" width="10" height="5" fill="#F5F2E8"/>
    <rect x="151.5" y="124.5" width="10" height="5" fill="#F5F2E8"/>
    <rect x="151.5" y="151.5" width="10" height="5" fill="#F5F2E8"/>
    <text x="100" y="146" text-anchor="middle" font-family="Space Grotesk" font-size="132" font-weight="700" fill="#0F1F1C">S</text>
  </g>
</svg>
