<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="48" height="48">
  <!-- Sideline app icon, small variant: for every output 48px and under, the favicon and the
       header mark. No HOME / AWAY labels and no stripes (noise at this size); the scores sit at
       the vertical centre, a little larger, and the frame and divider are heavier.
       Same palette and font as icon-master.svg; `npm run icons` outlines the text. -->
  <rect width="200" height="200" fill="#A3C14A"/>
  <g id="board">
    <rect x="10" y="32" width="180" height="136" rx="24" fill="#FFFFFF" stroke="#0F1F1C" stroke-width="8"/>
    <rect x="23" y="45" width="154" height="110" rx="14" fill="#0F1F1C"/>
    <line x1="100" y1="58" x2="100" y2="142" stroke="#2A453F" stroke-width="4"/>
    <text x="61" y="127" text-anchor="middle" font-family="Barlow Condensed" font-size="76" font-weight="800" fill="#A3C14A">23</text>
    <text x="139" y="127" text-anchor="middle" font-family="Barlow Condensed" font-size="76" font-weight="800" fill="#A3C14A">9</text>
  </g>
</svg>
