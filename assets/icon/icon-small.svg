<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="48" height="48">
  <!-- Sideline app icon, small variant: for every output 48px and under, the favicon and the
       header mark. No yard ticks (noise at this size); heavier sidelines and a larger S.
       Same palette and font as icon-master.svg; `npm run icons` outlines the text. -->
  <rect width="200" height="200" fill="#A3C14A"/>
  <g id="art">
    <rect x="25" y="10" width="10" height="180" fill="#F5F2E8"/>
    <rect x="165" y="10" width="10" height="180" fill="#F5F2E8"/>
    <text x="100" y="152.5" text-anchor="middle" font-family="Space Grotesk" font-size="150" font-weight="700" fill="#0F1F1C">S</text>
  </g>
</svg>
