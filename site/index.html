<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sideline</title>
  <meta name="description" content="Scores, stats and excitement ratings for every game.">
  <meta name="theme-color" content="#A3C14A">
  <meta name="color-scheme" content="light dark">
  <script>
    /* Resolve the theme before any CSS paints (no flash). Keep in sync with js/core/theme.js. */
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('sideline.theme') || 'system'; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Sideline">
  <!-- Icons from assets/icon/ (npm run icons). ?v=3 makes browsers fetch a changed icon fresh. -->
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="icon" href="icons/favicon.svg?v=3" type="image/svg+xml">
  <link rel="icon" href="favicon.ico?v=3" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=3">
  <!-- iPhone launch screens (scripts/build-icons.mjs) -->
